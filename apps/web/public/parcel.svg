<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
<title>3D parcel package icon</title><desc>Editable vector artwork redrawn from Ethiopian Delivery App UI screenshot. Transparent background.</desc>

